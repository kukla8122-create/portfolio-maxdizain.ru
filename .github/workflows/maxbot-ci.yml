name: MAX bot CI

on:
  push:
    branches: [maxbot-production]
  pull_request:
    branches: [maxbot-production]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile maxbot-entry.py maxbot-selfhosted.py maxbot-yandex.py maxbot-yandex-production.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build self-hosted Docker image
        run: docker build --pull -t maximum-maxbot:ci .
      - name: Check self-hosted image size
        run: |
          SIZE=$(docker image inspect maximum-maxbot:ci --format='{{.Size}}')
          echo "Self-hosted Docker image bytes: $SIZE"
          test "$SIZE" -lt 450000000
      - name: Smoke test self-hosted image
        run: |
          docker run -d --name maximum-maxbot-ci \
            --memory=192m --cpus=0.5 \
            -e BOT_TOKEN=TestToken_123456789 \
            -e MAX_AUTO_SUBSCRIBE=0 \
            -e PORT=8000 \
            -p 18000:8000 \
            maximum-maxbot:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18000/health | grep -q '"ok": true'; then
              STORAGE=$(curl -fsS http://127.0.0.1:18000/storage)
              echo "$STORAGE"
              echo "$STORAGE" | grep -q '"ok": true'
              echo "$STORAGE" | grep -q '"boot_count": 1'
              docker logs maximum-maxbot-ci
              break
            fi
            if [ "$i" -eq 20 ]; then docker logs maximum-maxbot-ci; exit 1; fi
            sleep 1
          done
      - name: Cleanup self-hosted container
        if: always()
        run: docker rm -f maximum-maxbot-ci >/dev/null 2>&1 || true

      - name: Build Yandex Serverless image
        run: docker build --pull -f Dockerfile.yandex -t maximum-maxbot-yandex:ci .
      - name: Check Yandex image size
        run: |
          SIZE=$(docker image inspect maximum-maxbot-yandex:ci --format='{{.Size}}')
          echo "Yandex Serverless Docker image bytes: $SIZE"
          test "$SIZE" -lt 500000000
      - name: Validate YMQ trigger parser
        run: |
          docker run --rm --entrypoint python maximum-maxbot-yandex:ci -c '
          import importlib.util, json
          spec=importlib.util.spec_from_file_location("my", "/app/maxbot-yandex.py")
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          update={"update_type":"bot_started","chat_id":123}
          event={"messages":[{"event_metadata":{"event_id":"evt-1"},"details":{"message":{"body":json.dumps(update)}}}]}
          rows=list(m.extract_trigger_updates(event))
          assert rows == [("evt-1", update)], rows
          print("YMQ trigger parser OK")
          '
      - name: Validate safe webhook activation gate
        run: |
          docker run --rm --entrypoint python maximum-maxbot-yandex:ci -c '
          import importlib.util, os
          spec=importlib.util.spec_from_file_location("prod", "/app/maxbot-yandex-production.py")
          prod=importlib.util.module_from_spec(spec); spec.loader.exec_module(prod)

          calls=[]
          class Core:
              MAX_BASE="https://platform-api2.max.ru"
              WEBHOOK_SECRET="safe_secret"
              @staticmethod
              def subscriptions():
                  return 200, {"subscriptions": []}
              @staticmethod
              def http_json(url, method="GET", obj=None, timeout=0):
                  calls.append((method, url, obj))
                  if url.endswith("/me"):
                      return 200, {"ok": True}
                  if url.endswith("/subscriptions") and method == "POST":
                      return 200, {"success": True}
                  raise AssertionError((method, url))
          class Storage:
              @staticmethod
              def status(): return {"ok": True}
          class SQS:
              @staticmethod
              def get_queue_attributes(**kwargs): return {"Attributes": {}}
          class Impl:
              YMQ_QUEUE_URL="https://queue.example/maxbot"
              @staticmethod
              def public_base_from_request(handler): return "https://bot.example"
              @staticmethod
              def create_handler(core, storage, sqs): return object

          H=prod.create_safe_handler(Impl, Core, Storage(), SQS())
          h=H()
          result={}
          h.json_response=lambda status, obj: result.update(status=status, obj=obj)

          os.environ["MAX_ACTIVATE_WEBHOOK"]="0"
          h._ready()
          assert result["status"] == 200, result
          assert result["obj"]["activation_enabled"] is False, result
          assert result["obj"]["webhook"] is False, result
          assert not any(m == "POST" and u.endswith("/subscriptions") for m,u,_ in calls), calls

          calls.clear(); result.clear()
          os.environ["MAX_ACTIVATE_WEBHOOK"]="1"
          h._ready()
          assert result["status"] == 200, result
          assert result["obj"]["activation_enabled"] is True, result
          assert result["obj"]["webhook"] is True, result
          assert sum(1 for m,u,_ in calls if m == "POST" and u.endswith("/subscriptions")) == 1, calls
          print("Webhook activation gate OK")
          '
      - name: Smoke test Yandex Serverless image
        run: |
          docker run -d --name maximum-maxbot-yandex-ci \
            --memory=256m --cpus=0.5 \
            -e BOT_TOKEN=TestToken_123456789 \
            -e AWS_ACCESS_KEY_ID=TESTACCESSKEY123 \
            -e AWS_SECRET_ACCESS_KEY=TESTSECRETKEY123 \
            -e YMQ_QUEUE_URL=https://message-queue.api.cloud.yandex.net/fake/fake/maxbot \
            -e YDB_CONNECTION_STRING=grpcs://ydb.serverless.yandexcloud.net:2135/local-test \
            -e MAX_ACTIVATE_WEBHOOK=0 \
            -e PORT=8000 \
            -p 18001:8000 \
            maximum-maxbot-yandex:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18001/health | grep -q '"platform": "yandex-serverless"'; then
              docker logs maximum-maxbot-yandex-ci
              exit 0
            fi
            if [ "$i" -eq 20 ]; then docker logs maximum-maxbot-yandex-ci; exit 1; fi
            sleep 1
          done
      - name: Cleanup Yandex Serverless container
        if: always()
        run: docker rm -f maximum-maxbot-yandex-ci >/dev/null 2>&1 || true
