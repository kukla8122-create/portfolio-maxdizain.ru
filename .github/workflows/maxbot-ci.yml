name: MAX bot CI

on:
  push:
    branches: [maxbot-production]
  pull_request:
    branches: [main, maxbot-production]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install production and repository test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements-functions.txt \
            -r requirements-yandex.txt

      - name: Compile production Python sources
        run: |
          python -m py_compile \
            maxbot-selfhosted.py \
            maxbot-selfhosted-yandex.py \
            maxbot_yandex_functions.py

      - name: Unit and production guardrail tests
        run: python -m unittest discover -s tests -v

      - name: Validate deployment shell syntax
        run: |
          bash -n deploy/yandex-preflight.sh
          bash -n deploy/yandex-bootstrap.sh
          bash -n deploy/yandex-status.sh
          bash -n deploy/max-token-check.sh
          bash -n deploy/activate-max-webhook.sh
          bash -n deploy/rollback-max-webhook.sh

      - name: Execute bootstrap launcher in non-mutating validation mode
        run: |
          output="$(MAXBOT_BOOTSTRAP_VALIDATE_ONLY=1 bash deploy/yandex-bootstrap.sh)"
          printf '%s\n' "$output"
          grep -Fq 'Integrity: OK' <<<"$output"
          grep -Fq 'Cloud Functions CLI compatibility: OK' <<<"$output"
          grep -Fq 'Full YDB topic path: OK' <<<"$output"
          grep -Fq 'Parameterized YDB verification: OK' <<<"$output"
          grep -Fq 'Shell syntax: OK' <<<"$output"
          grep -Fq 'MAX webhook activation: OFF throughout bootstrap' <<<"$output"
          grep -Fq 'VALIDATION_ONLY_OK' <<<"$output"

      - name: Verify the canonical launcher is immutable and guarded
        run: |
          grep -Fq 'BASE_COMMIT="9a5ea38136d9fecddd59cd70c7e7ce1b11c3a84e"' deploy/yandex-bootstrap.sh
          grep -Fq 'BASE_BLOB="da2f56eaee11955ee3b9b7a99dfb9b41ca17015c"' deploy/yandex-bootstrap.sh
          grep -Fq 'ACTUAL_BLOB="$(git hash-object "$BASE")"' deploy/yandex-bootstrap.sh
          grep -Fq 'YDS_TOPIC=$YDB_PATH/$STREAM_NAME' deploy/yandex-bootstrap.sh
          grep -Fq 'DECLARE $event_id AS Utf8;' deploy/yandex-bootstrap.sh
          grep -Fq 'MAXBOT_BOOTSTRAP_VALIDATE_ONLY' deploy/yandex-bootstrap.sh

      - name: Build the exact Cloud Functions source layout
        run: |
          rm -rf /tmp/maximum-function-src
          mkdir -p /tmp/maximum-function-src
          cp maxbot_yandex_functions.py /tmp/maximum-function-src/
          cp maxbot-selfhosted.py /tmp/maximum-function-src/maxbot-selfhosted-core.py
          cp maxbot-selfhosted-yandex.py /tmp/maximum-function-src/
          cp requirements-functions.txt /tmp/maximum-function-src/requirements.txt
          python -m py_compile \
            /tmp/maximum-function-src/maxbot_yandex_functions.py \
            /tmp/maximum-function-src/maxbot-selfhosted-core.py \
            /tmp/maximum-function-src/maxbot-selfhosted-yandex.py

      - name: Validate runtime and cutover credential boundaries statically
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime = Path('maxbot_yandex_functions.py').read_text(encoding='utf-8')
          assert 'write_with_ack' in runtime
          assert 'storage.get_deployment_secret("max_bot_token")' in runtime
          assert 'storage.get_deployment_secret("max_webhook_secret")' in runtime
          assert '"max_token_present": bool(os.environ.get("MAX_BOT_TOKEN"))' in runtime
          token_check = Path('deploy/max-token-check.sh').read_text(encoding='utf-8')
          assert 'platform-api2.max.ru' in token_check
          assert 'MAX_TOKEN_CHECK=VALID' in token_check
          assert '/subscriptions' not in token_check
          activation = Path('deploy/activate-max-webhook.sh').read_text(encoding='utf-8')
          assert 'deployment_secrets' in activation
          assert 'Type ACTIVATE' in activation
          assert 'read_all_messages' in activation and 'write' in activation
          rollback = Path('deploy/rollback-max-webhook.sh').read_text(encoding='utf-8')
          assert 'deployment_secrets' in rollback
          assert 'DECLARE $key AS Utf8;' in rollback
          assert '--input-file "$TMP/read-token.json"' in rollback
          assert 'Type ROLLBACK' in rollback
          assert '--data-urlencode "url=$WEBHOOK_URL"' in rollback
          print('Runtime and cutover credential boundaries OK')
          PY
