name: MAX bot CI

on:
  push:
    branches: [maxbot-production]
  pull_request:
    branches: [maxbot-production]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install production and repository test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements-functions.txt \
            -r requirements-yandex.txt

      - name: Compile production Python sources
        run: |
          python -m py_compile \
            maxbot-selfhosted.py \
            maxbot-selfhosted-yandex.py \
            maxbot_yandex_functions.py

      - name: Unit and production guardrail tests
        run: python -m unittest discover -s tests -v

      - name: Validate deployment shell syntax
        run: |
          bash -n deploy/yandex-preflight.sh
          bash -n deploy/yandex-bootstrap.sh
          bash -n deploy/activate-max-webhook.sh
          bash -n deploy/rollback-max-webhook.sh

      - name: Verify production path has no Docker Registry or Lockbox dependency
        run: |
          ! grep -Eqi 'yc[[:space:]]+container[[:space:]]+registry|yc[[:space:]]+lockbox|docker[[:space:]]+build|buildah' deploy/yandex-bootstrap.sh
          grep -Fq 'yc serverless function version create' deploy/yandex-bootstrap.sh
          grep -Fq 'maxbot_yandex_functions.ingress_handler' deploy/yandex-bootstrap.sh
          grep -Fq 'maxbot_yandex_functions.worker_handler' deploy/yandex-bootstrap.sh
          grep -Fq 'CREATE TABLE IF NOT EXISTS deployment_secrets' deploy/yandex-bootstrap.sh
          grep -Fq 'MAX webhook activation: OFF' deploy/yandex-bootstrap.sh

      - name: Build the exact Cloud Functions source layout
        run: |
          rm -rf /tmp/maximum-function-src
          mkdir -p /tmp/maximum-function-src
          cp maxbot_yandex_functions.py /tmp/maximum-function-src/
          cp maxbot-selfhosted.py /tmp/maximum-function-src/maxbot-selfhosted-core.py
          cp maxbot-selfhosted-yandex.py /tmp/maximum-function-src/
          cp requirements-functions.txt /tmp/maximum-function-src/requirements.txt
          python -m py_compile \
            /tmp/maximum-function-src/maxbot_yandex_functions.py \
            /tmp/maximum-function-src/maxbot-selfhosted-core.py \
            /tmp/maximum-function-src/maxbot-selfhosted-yandex.py

      - name: Validate public and private credential boundaries statically
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('deploy/yandex-bootstrap.sh').read_text(encoding='utf-8')
          ingress_start = text.index('say "Deploy token-free public ingress function"')
          worker_start = text.index('say "Deploy private worker function with no MAX credentials')
          trigger_start = text.index('say "Pause exact legacy triggers')
          ingress = text[ingress_start:worker_start]
          worker = text[worker_start:trigger_start]
          assert 'MAX_WEBHOOK_SECRET' in ingress
          assert 'MAX_BOT_TOKEN=' not in ingress
          assert 'allow-unauthenticated-invoke' in ingress
          assert '--environment "YDB_CONNECTION_STRING=$YDB_CS"' in worker
          assert 'MAX_BOT_TOKEN=' not in worker
          assert 'MAX_WEBHOOK_SECRET=' not in worker
          assert 'deny-unauthenticated-invoke' in worker
          runtime = Path('maxbot_yandex_functions.py').read_text(encoding='utf-8')
          assert 'storage.get_deployment_secret("max_bot_token")' in runtime
          assert 'storage.get_deployment_secret("max_webhook_secret")' in runtime
          print('Ingress has no MAX token; private worker loads MAX credentials from YDB')
          PY
