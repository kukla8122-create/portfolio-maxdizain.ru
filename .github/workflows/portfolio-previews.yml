name: Build optimized portfolio previews
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/portfolio-previews.yml
      - .github/scripts/generate_previews.py
      - images/kitchens/*.jpg
      - images/wardrobes/*.jpg
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-portfolio-previews
  cancel-in-progress: false

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c # v4.2.2
        with:
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install image processing
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate optimized previews
        run: python .github/scripts/generate_previews.py
      - name: Commit only new small preview files
        run: |
          git config user.name "maximum-portfolio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/kitchens/previews images/wardrobes/previews
          if ! git diff --cached --quiet; then
            git commit -m "Add lightweight portfolio card previews (preserve originals)"
            git push origin HEAD:main
          fi
