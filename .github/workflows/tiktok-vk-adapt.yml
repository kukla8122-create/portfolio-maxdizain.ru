name: Prepare owned VK clips for TikTok
on:
  push:
    paths:
      - .github/workflows/tiktok-vk-adapt.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Download public company clips from VK
        run: |
          mkdir -p _vk_sources media/tiktok
          yt-dlp --no-playlist -f 'best[height<=1080]/best' -o '_vk_sources/%(id)s.%(ext)s'             'https://vk.com/clip-108807288_456239350'             'https://vk.com/clip-108807288_456239353'
      - name: Reframe vertical 9 by 16; preserve geometry, strip potentially licensed VK audio
        run: |
          ffmpeg -hide_banner -loglevel error -y             -i '_vk_sources/-108807288_456239350.mp4'             -vf 'crop=ih*9/16:ih:(iw-ih*9/16)/2:0,scale=1080:1920,fps=30'             -an -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -movflags +faststart             'media/tiktok/vk-kuhnya-checklist-350.mp4'
          ffmpeg -hide_banner -loglevel error -y             -i '_vk_sources/-108807288_456239353.mp4'             -vf 'crop=ih:ih:(iw-ih)/2:0,scale=1080:1080,pad=1080:1920:0:420:color=0x073c34,fps=30'             -an -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -movflags +faststart             'media/tiktok/vk-kuhnya-design-353.mp4'
      - name: Save ready MP4s into the site's public media library
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/tiktok
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare TikTok videos from owned VK clips [skip ci]'
            git push
          fi
