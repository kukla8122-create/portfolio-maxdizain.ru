name: Publish-ready TikTok edits from VK collection
on:
  push:
    paths:
      - .github/workflows/tiktok-vk-more.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  adapt-clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install video tools
        run: python -m pip install --disable-pip-version-check yt-dlp imageio-ffmpeg
      - name: Download owned clips
        run: |
          mkdir -p _vk_sources media/tiktok
          yt-dlp --no-playlist -f 'best[height<=1080]/best' -o '_vk_sources/%(id)s.%(ext)s' \
            'https://vk.com/clip-108807288_456239347' \
            'https://vk.com/clip-108807288_456239357' \
            'https://vk.com/clip-108807288_456239337'
      - name: Make safe 9:16 layouts without distorting furniture
        run: |
          FFMPEG="$(python -c 'from imageio_ffmpeg import get_ffmpeg_exe; print(get_ffmpeg_exe())')"
          for item in "347:шкаф-система" "357:детская-мебель" "337:3d-проект"; do
            ID="${item%%:*}"
            NAME="${item#*:}"
            "$FFMPEG" -hide_banner -loglevel error -y \
              -i "_vk_sources/-108807288_456239${ID}.mp4" \
              -filter_complex "[0:v]split=2[front][back];[back]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=30:1[blur];[front]scale=1080:1920:force_original_aspect_ratio=decrease[sharp];[blur][sharp]overlay=(W-w)/2:(H-h)/2,format=yuv420p,fps=30[out]" \
              -map "[out]" -an -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -movflags +faststart \
              "media/tiktok/vk-${NAME}-${ID}.mp4"
          done
      - name: Save originals' adapted copies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/tiktok
          if ! git diff --cached --quiet; then
            git commit -m 'Add 3 TikTok vertical edits from company VK clips [skip ci]'
            git push
          fi
